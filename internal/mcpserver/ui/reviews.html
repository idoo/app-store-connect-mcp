<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>app-store-connect-mcp · Reviews</title>
<style>:root{color-scheme:light dark;--color-background-primary:light-dark(#fff,#171717);--color-background-secondary:light-dark(#f5f5f5,#262626);--color-text-primary:light-dark(#171717,#fafafa);--color-text-secondary:light-dark(#525252,#a3a3a3);--color-border-primary:light-dark(#e5e5e5,#404040);--ok:light-dark(#15803d,#4ade80);--warn:light-dark(#b45309,#fbbf24);--block:light-dark(#b91c1c,#f87171);--accent:light-dark(#2563eb,#60a5fa);--font-sans:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;padding:12px;font:14px/1.4 var(--font-sans);background:var(--color-background-primary);color:var(--color-text-primary)}
h1{font-size:16px;margin:0 0 8px}h2{font-size:14px;margin:12px 0 6px}.muted{color:var(--color-text-secondary);font-size:12px}
.card{border:1px solid var(--color-border-primary);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--color-background-secondary)}
.row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.grow{flex:1;min-width:0}
.b{font-size:11px;font-weight:600;padding:1px 6px;border-radius:9px;border:1px solid currentColor}.ok{color:var(--ok)}.warn{color:var(--warn)}.block{color:var(--block)}
button{font:inherit;font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}button.armed{background:var(--block);border-color:var(--block);color:#fff}
pre,.txt{white-space:pre-wrap;word-break:break-word;margin:4px 0;font-size:12px}textarea{width:100%;font:inherit;font-size:13px;min-height:60px;background:var(--color-background-primary);color:var(--color-text-primary);border:1px solid var(--color-border-primary);border-radius:6px}
del{color:var(--block)}ins{color:var(--ok);text-decoration:none}</style></head>
<body><main id="app"></main>
<script>
"use strict";const SCREEN="reviews";
function list(o,...k){for(const n of k)if(o&&Array.isArray(o[n]))return o[n];return[]}

function render(root,d,inp){add(root,el("h1",null,"Customer reviews"));const apps=list(d,"apps");const all=apps.length?apps:[d];
 for(const a of all){if(a.name||a.app)add(root,el("h2",null,str(a.name||a.app)));for(const r of list(a,"reviews")){const card=el("div","card"),row=el("div","row"),out=el("div");
  const n=Math.max(0,Math.min(5,+r.rating||0));add(row,el("span","b "+(n<=2?"block":n===3?"warn":"ok"),"★".repeat(n)+"☆".repeat(5-n)),el("strong","grow",str(r.title)),el("span","muted",[str(r.territory),str(r.nickname),str(r.createdDate||r.date)].filter(Boolean).join(" · ")));
  add(card,row,el("div","txt",str(r.body)));if(r.response)add(card,el("div","muted","Current reply: "),el("div","txt",str(r.response.body)));
  const ta=el("textarea");ta.placeholder="Draft a public reply ("+str(r.reply_locale||"")+")";const app=str(a.id||a.app_id||inp.app||"");
  const b=el("button",null,"Preview reply");b.onclick=()=>{const w=writeButton("Send reply","reviews_reply",{app:app||undefined,replies:[{review_id:str(r.id),body:ta.value}]},out);b.replaceWith(w);ta.oninput=()=>{w.replaceWith(b)};w.click()};
  add(card,ta,b,out);add(root,card)}}}


const S={input:{},result:null};let seq=0;const pend={};
function rpc(method,params){return new Promise((res,rej)=>{const id=++seq;pend[id]={res,rej};parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
function note(method,params){parent.postMessage({jsonrpc:"2.0",method,params},"*")}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e}
function add(p,...c){for(const x of c)if(x)p.appendChild(x);return p}
function str(v){if(v==null)return"";if(typeof v==="object")return v.text!=null?String(v.text):v.value!=null?String(v.value):JSON.stringify(v);return String(v)}
function data(r){r=r||{};if(r.structuredContent)return r.structuredContent;try{const t=(r.content||[]).find(c=>c.type==="text");return t?JSON.parse(t.text):{}}catch(_){return{}}}
function theme(c){if(!c)return;const root=document.documentElement;if(c.theme)root.style.colorScheme=c.theme;const v=c.styles&&c.styles.variables;if(v)for(const k in v)if(/^--[a-z0-9-]+$/.test(k)&&typeof v[k]==="string")root.style.setProperty(k,v[k])}
/* Writes: the first click calls the tool without confirm/plan_id (the server
 only previews); a second explicit click sends the server's plan_id, or
 confirm:true for flag-confirmed tools. The server gates stay authoritative. */
function writeButton(label,tool,args,out){const b=el("button",null,label);let plan=null;
 b.onclick=async()=>{b.disabled=true;try{
  if(!plan){const r=await rpc("tools/call",{name:tool,arguments:args});const d=data(r);out.replaceChildren(el("pre",null,JSON.stringify(d.preview||d,null,1)));
   if(r&&r.isError){b.textContent=label;return}plan=d.plan_id?{plan_id:d.plan_id}:{confirm:true};b.textContent="Confirm "+label.toLowerCase();b.className="armed"}
  else{const r=await rpc("tools/call",{name:tool,arguments:Object.assign({},args,plan)});plan=null;b.className="";b.textContent=label;out.replaceChildren(el("pre",null,JSON.stringify(data(r),null,1)))}
 }catch(e){out.replaceChildren(el("pre","block",str(e&&e.message||e)))}finally{b.disabled=false;resize()}};return b}
function resize(){note("ui/notifications/size-changed",{width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight})}
function draw(){const root=document.getElementById("app");root.replaceChildren();if(!S.result){add(root,el("p","muted","Waiting for tool result…"));return resize()}
 if(S.result.isError){add(root,el("pre","block",JSON.stringify(data(S.result),null,1)));return resize()}
 try{render(root,data(S.result),S.input)}catch(e){add(root,el("pre","block",str(e)))}resize()}
addEventListener("message",e=>{if(e.source!==parent)return;const m=e.data;if(!m||m.jsonrpc!=="2.0")return;
 if(m.id!=null&&!m.method&&pend[m.id]){const p=pend[m.id];delete pend[m.id];m.error?p.rej(m.error):p.res(m.result);return}
 const p=m.params||{};if(m.method==="ui/notifications/tool-input"){S.input=p.arguments||{};draw()}
 else if(m.method==="ui/notifications/tool-result"){S.result=p;draw()}
 else if(m.method==="ui/notifications/host-context-changed")theme(p);
 else if(m.id!=null&&m.method==="ping")parent.postMessage({jsonrpc:"2.0",id:m.id,result:{}},"*")});
rpc("ui/initialize",{appCapabilities:{availableDisplayModes:["inline"]},clientInfo:{name:"app-store-connect-mcp-"+SCREEN,version:"1"},protocolVersion:"2026-01-26"}).then(r=>{theme(r&&r.hostContext);note("ui/notifications/initialized",{});draw()}).catch(()=>draw());
new ResizeObserver(resize).observe(document.body);

</script></body></html>
