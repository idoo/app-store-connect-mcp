name: Publish to MCP Registry

# Called by release.yml after the release is published; run by hand to
# re-publish an existing release (e.g. after a registry validation fix).
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry OIDC login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          dir="$RUNNER_TEMP/mcpb"
          mcpb="app-store-connect-mcp-${version}.mcpb"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern "$mcpb"
          # v0.9.0+ list the .mcpb in the cosign-signed checksums-extra.txt;
          # older releases only have the .mcpb itself.
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern checksums-extra.txt; then
            (cd "$dir" && grep -F "  $mcpb" checksums-extra.txt | sha256sum -c -)
          fi
          sha=$(sha256sum "$dir/$mcpb" | awk '{print $1}')
          scripts/publish-registry.sh "$TAG" "$sha"
