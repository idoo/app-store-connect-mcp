name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Spec-drift PRs are opened with GITHUB_TOKEN, which does not trigger
  # pull_request runs; spec-drift.yml dispatches this workflow instead.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same exact toolchain as release.yml, so CI tests what ships. Bump it
  # together with go.mod's toolchain line, release.yml and the Dockerfile.
  GO_VERSION: "1.26.10"

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.10"]
        include:
          # go.mod's minimum Go, so newer-only APIs fail CI. GOTOOLCHAIN=local
          # keeps it from switching to go.mod's toolchain line.
          - os: ubuntu-latest
            go: "1.25.x"
            gotoolchain: local
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: ${{ matrix.gotoolchain || 'auto' }}
    steps:
      # Goldens, fixtures and embedded files are compared byte for byte.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      # -race needs cgo + a C toolchain on Windows runners; plain tests cover
      # the %AppData%/%LocalAppData% and rename paths.
      - if: runner.os == 'Windows'
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  deadcode:
    name: no unreachable code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # deadcode exits 0 even when it reports; fail on any output. -test
      # counts tests as roots, so test-only helpers belong in _test.go files.
      - name: deadcode -test ./...
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@v0.38.0 -test ./...)"
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            exit 1
          fi

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ env.GO_VERSION }}
          check-latest: true
          go-package: ./...

  generate:
    name: generated files are fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # The spec index is regenerated only by spec-drift.yml (needs Apple's
      # zip via ASC_MCP_SPEC); here only the docs generator runs.
      - name: Regenerate docs/TOOLS.md and docs/tools.json
        run: go run ./internal/tools/docsgen
      - run: git diff --exit-code

  compat:
    name: wire-API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-compat.sh
        env:
          GH_TOKEN: ${{ github.token }}

  release-dry-run:
    name: goreleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign
      # Validation runs npm code, so it lives here (contents: read, no
      # id-token) and never in release.yml.
      - name: Build and validate .mcpb
        run: VALIDATE=1 scripts/build-mcpb.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh
      - name: no tracked binaries
        run: |
          bins=$(git ls-files -z | xargs -0 file -N | grep -E ':[[:space:]]*(ELF|Mach-O|PE32|MS-DOS executable)' || true)
          if [ -n "$bins" ]; then
            echo "tracked executables (build output must not be committed):" >&2
            echo "$bins" >&2
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The binary, not gitleaks-action: no license key and no PR comments.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
